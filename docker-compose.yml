# docker compose up -d --build      (python bootstrap.py does this, plus .env and checks)
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "8001"
      SANDBOX_URL: http://sandbox:9000
    depends_on: [sandbox]
    networks: [edge, internal]
    ports: ["${APP_BIND:-127.0.0.1}:${APP_PORT:-8001}:8001"]     # use APP_BIND=0.0.0.0 to expose it without a proxy
    volumes:
      - data:/data
      - chroma:/app/docuteam/chroma
      - workspace:/app/docuteam/workspace
      - outputs:/app/outputs
    restart: unless-stopped
  sandbox:                                    # generated code runs HERE, never in the app container
    build: {context: ., dockerfile: runner/Dockerfile}
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?set SANDBOX_TOKEN in .env}
      SANDBOX_SLOTS: ${SANDBOX_SLOTS:-2}
    networks: [internal]                      # internal: no route to the internet
    read_only: true
    tmpfs: ["/work:size=256m,uid=1000", "/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    restart: unless-stopped
  caddy:                                      # optional HTTPS: docker compose --profile tls up -d  (set DOMAIN in .env)
    image: caddy:2
    profiles: ["tls"]
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:8000
    ports: ["80:80", "443:443"]
    networks: [edge]
    volumes: [caddy:/data]
  egress:                               # optional: docker compose --profile egress up -d  (set SANDBOX_PROXY in .env)  , docker compose --profile internet up -d, docker compose logs -f egress, docker compose exec sandbox curl -I https://pypi.org, docker compose exec sandbox ./run_tests.sh
    environment:
      - EGRESS_ALLOW=files.pythonhosted.org,repo.mycompany.com,api.openai.com
networks:
  edge: {}
  internal: {internal: true}
volumes: {data: {}, chroma: {}, workspace: {}, outputs: {}, caddy: {}}
