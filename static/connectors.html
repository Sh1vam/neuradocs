<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connectors</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14202e;--muted:#5b6877;--line:#d5dce5;--accent:#1f46c9;--on-accent:#fff;--ok:#1d6b45;--warn:#8f5200;--serif:Georgia,Cambria,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d131a;--panel:#141c25;--ink:#e5ebf2;--muted:#8d9aab;--line:#273341;--accent:#86a7ff;--on-accent:#0d131a;--ok:#63c28f;--warn:#e0a24a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px}
a{color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.lead{margin:0;color:var(--muted);font:16px/1.6 var(--serif)}
h2{margin:0 0 8px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.tag{margin-left:8px;font-size:12px;color:var(--muted)}
.card p{margin:4px 0 8px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 12px;color:var(--ink)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0;font:13px/1.5 ui-monospace,Consolas,monospace}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input:not([type]){width:100%;padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{margin-left:10px;font-size:13px}.ok{color:var(--ok)}.err{color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Connectors</h1><a href="/">Back to chat</a></header>
<main>
  <p class="lead">External APIs the agent can call. The token stays in your <code>.env</code> file: here you only give its variable name. The call is made by the app, so the token never reaches the model or the sandbox.</p>
  <section><h2>Your connectors</h2><div id="list"></div></section>
  <section>
    <h2>Add a connector</h2>
    <form id="add" class="card">
      <div class="row"><span class="note">Start from:</span><button type="button" data-preset="github">GitHub</button><button type="button" data-preset="weather">Weather</button><button type="button" data-preset="hf">Hugging Face</button><button type="button" data-preset="demo">Demo API</button></div>
      <div class="two"><div><label for="name">Name (lowercase letters, digits, hyphens)</label><input id="name" required maxlength="41"></div>
      <div><label for="base">Base URL (https only)</label><input id="base" required placeholder="https://api.example.com"></div></div>
      <label for="desc">What is it for? (the agent reads this)</label><input id="desc" required maxlength="300">
      <div class="two"><div><label for="tokenenv">Token variable in .env (a name such as GITHUB_TOKEN, not the token)</label><input id="tokenenv" maxlength="61"></div>
      <div><label for="header">Header and prefix</label><div class="row"><input id="header" value="Authorization" style="flex:2"><input id="prefix" value="Bearer " style="flex:1"></div></div></div>
      <label><input type="checkbox" id="write"> Allow changes (POST, PUT, PATCH, DELETE). Leave this off unless you need it: anything the agent reads from a web page or document could try to steer it.</label>
      <p><button class="primary" type="submit">Save connector</button><span id="msg" class="msg"></span></p>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const PRESETS = {
  github: { name: 'github', base: 'https://api.github.com', desc: 'GitHub REST API: repositories, issues, pull requests, code search', env: 'GITHUB_TOKEN' },
  weather: { name: 'weather', base: 'https://api.open-meteo.com', desc: 'Open-Meteo: weather forecast for a latitude and longitude, no key needed', env: '' },
  hf: { name: 'huggingface', base: 'https://huggingface.co/api', desc: 'Hugging Face Hub API: models, datasets and spaces', env: 'HF_TOKEN' },
  demo: { name: 'jsonplaceholder', base: 'https://jsonplaceholder.typicode.com', desc: 'A fake REST API for trying connectors: posts, users, todos', env: '' },
};
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}
function card(c) {
  const el = mk('div', 'card'), head = mk('div'), row = mk('div', 'row'), out = mk('pre');
  out.hidden = true;
  head.append(mk('b', null, c.name), mk('span', 'tag', new URL(c.base_url).host + (c.allow_write ? ', read and write' : ', read-only')),
    mk('span', 'tag', c.token_env ? c.token_env + (c.token_set ? ' (set)' : ' (NOT set in .env)') : 'no token'));
  const test = mk('button', null, 'Test (GET)');
  test.onclick = async () => {
    const path = prompt('Path to request, starting with /', '/');
    if (path === null) return;
    out.hidden = false; out.textContent = 'Calling…';
    try { out.textContent = (await api('/api/connectors/' + c.name + '/test', 'POST', { path })).result; } catch (e) { out.textContent = e.message; }
  };
  const del = mk('button', null, 'Delete');
  del.onclick = async () => { if (confirm('Delete the connector “' + c.name + '”?')) { await api('/api/connectors/' + c.name, 'DELETE'); load(); } };
  row.append(test, del);
  el.append(head, mk('p', null, c.description), row, out);
  return el;
}
async function load() {
  const d = await api('/api/connectors');
  $('#list').replaceChildren(...(d.connectors.length ? d.connectors.map(card) : [mk('p', 'note', 'No connectors yet. Pick one below, or fill in the form.')]));
}
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => {
  const p = PRESETS[b.dataset.preset];
  $('#name').value = p.name; $('#base').value = p.base; $('#desc').value = p.desc; $('#tokenenv').value = p.env;
});
$('#add').onsubmit = async e => {
  e.preventDefault();
  const msg = $('#msg');
  try {
    await api('/api/connectors', 'POST', { name: $('#name').value, description: $('#desc').value, base_url: $('#base').value, token_env: $('#tokenenv').value,
      token_header: $('#header').value, token_prefix: $('#prefix').value, allow_write: $('#write').checked });
    msg.className = 'msg ok'; msg.textContent = 'Saved. The agent can use it now.';
    e.target.reset(); $('#header').value = 'Authorization'; $('#prefix').value = 'Bearer '; load();
  } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
};
load();
</script>
</body>
</html>
