<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills</title>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14202e;--muted:#5b6877;--line:#d5dce5;--accent:#1f46c9;--on-accent:#fff;--ok:#1d6b45;--warn:#8f5200;--serif:Georgia,Cambria,serif;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d131a;--panel:#141c25;--ink:#e5ebf2;--muted:#8d9aab;--line:#273341;--accent:#86a7ff;--on-accent:#0d131a;--ok:#63c28f;--warn:#e0a24a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:17px}
a{color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:24px 16px;display:flex;flex-direction:column;gap:22px}
.lead{margin:0;color:var(--muted);font:16px/1.6 var(--serif)}
h2{margin:0 0 8px;font-size:15px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.tag{margin-left:8px;font-size:12px;color:var(--muted)}
.card p{margin:4px 0 8px;color:var(--muted)}
.row{display:flex;gap:8px}
button{font:inherit;cursor:pointer;background:none;border:1px solid var(--line);border-radius:8px;padding:3px 12px;color:var(--ink)}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
pre{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:8px;margin:8px 0 0;font:13px/1.5 ui-monospace,Consolas,monospace}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
.msg{margin-left:10px;font-size:13px}.ok{color:var(--ok)}.err{color:var(--warn)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Skills</h1><a href="/">Back to chat</a></header>
<main>
  <p class="lead">Saved instructions and workflows that the agent and the builder follow, so they work the same way every time. Only a skill’s name and description are always in the prompt; its full text is loaded when it is used.</p>
  <section><h2 id="ph" hidden>Waiting for your approval</h2><div id="pending"></div></section>
  <section><h2>Your skills</h2><div id="list"></div></section>
  <section>
    <h2>Add a skill</h2>
    <form id="add" class="card">
      <label for="name">Name (lowercase letters, digits, hyphens)</label><input id="name" required maxlength="63">
      <label for="desc">When should it be used? (one or two sentences)</label><input id="desc" required maxlength="400">
      <label for="body">Instructions or workflow</label><textarea id="body" rows="8" required maxlength="8000"></textarea>
      <p><button class="primary" type="submit">Save skill</button><span id="msg" class="msg"></span></p>
    </form>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
async function api(path, method = 'GET', body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}
function card(s, pending) {
  const c = mk('div', 'card'), head = mk('div'), row = mk('div', 'row'), body = mk('pre');
  body.hidden = true;
  head.append(mk('b', null, s.name), mk('span', 'tag', pending ? 'proposed by the agent' : s.source));
  const view = mk('button', null, 'View');
  view.onclick = async () => { if (body.hidden) body.textContent = (await api('/api/skills/' + s.name + (pending ? '?pending=1' : ''))).body; body.hidden = !body.hidden; };
  row.append(view);
  if (pending) {
    const ok = mk('button', 'primary', 'Approve');
    ok.onclick = async () => { await api('/api/skills/' + s.name + '/approve', 'POST'); load(); };
    row.append(ok);
  }
  if (pending || s.source === 'user') {
    const del = mk('button', null, pending ? 'Reject' : 'Delete');
    del.onclick = async () => { if (confirm('Delete the skill “' + s.name + '”?')) { await api('/api/skills/' + s.name + (pending ? '?pending=1' : ''), 'DELETE'); load(); } };
    row.append(del);
  }
  c.append(head, mk('p', null, s.description), row, body);
  return c;
}
async function load() {
  const d = await api('/api/skills');
  $('#pending').replaceChildren(...d.pending.map(s => card(s, true)));
  $('#ph').hidden = !d.pending.length;
  $('#list').replaceChildren(...d.skills.map(s => card(s, false)));
}
$('#add').onsubmit = async e => {
  e.preventDefault();
  const msg = $('#msg');
  try {
    await api('/api/skills', 'POST', { name: $('#name').value, description: $('#desc').value, instructions: $('#body').value });
    msg.className = 'msg ok'; msg.textContent = 'Saved. The agent and the builder can use it now.';
    e.target.reset(); load();
  } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; }
};
load();
</script>
</body>
</html>
